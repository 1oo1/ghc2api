# 推送 v* 标签或手动触发时，构建 linux/amd64 + linux/arm64 镜像并推送到 GitHub Container Registry。
name: docker

on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: 测试
        run: go vet ./... && go test ./...

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 标签触发：v1.2.3 -> 1.2.3、1.2、1、latest（0.x 不打主版本标签 0；预发布标签如 v1.2.3-rc.1 只打完整版本号，不打 latest）。
      # 手动触发：在标签上运行时同上；在分支上运行时使用分支名与短 commit。
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=ref,event=branch
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 标签构建使用标签名作为版本号；分支构建使用 dev-<短 commit>。
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', substring(github.sha, 0, 7)) }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
