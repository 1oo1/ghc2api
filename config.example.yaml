# HTTP 监听地址；省略或留空时使用 127.0.0.1:8080。
listen: "127.0.0.1:8080"

# 程序数据目录；相对路径以本配置文件所在目录为基准，默认 ./data。
# credentials 和缓存分别放在 credentials/、cache/ 子目录中。
data_path: "./data"

# OAuth 凭证 JSON 文件路径；相对路径位于 data_path/credentials 下。
# 留空时默认使用 credentials/credentials.json；绝对路径可指定 data_path 之外的文件。
# 格式示例：{"oauth_token":"...","host":"acme.ghe.com","user":"alice"}
# 请将凭证文件权限设为 0600（chmod 600）。
credentials: "credentials.json"

# 可选的 GitHub Enterprise Cloud 登录域名；留空时使用凭证中的 host 或 github.com。
host: ""

# 本服务的访问密钥，不是 GitHub token。非本机监听地址必须设置。
api_key: ""

# 日志级别：debug、info、warn 或 error。debug 会记录脱敏后的完整上游 API 正文，
# 会增加内存和日志占用；日志中也可能包含提示词和生成内容等业务数据。
log_level: "info"

# 日志目录；相对路径以本配置文件所在目录为基准，默认 ./logs。
logs_path: "./logs"

# 日志单文件大小上限，单位 MiB；必须为正整数，默认 10。
log_max_size_mb: 10

# 达到大小上限后最多保留的滚动备份数，范围 0 到 100，默认 5；0 表示不保留备份。
log_max_backups: 5

# 模型列表缓存有效期，使用 Go duration 格式；必须大于 0，默认 2h。
models_cache_ttl: "2h"

# 配置文件不保存凭证值；仍建议将实际 config.yaml 权限设为 0600（chmod 600）。
