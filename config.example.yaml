# HTTP 监听地址；省略或留空时使用 127.0.0.1:8080。
listen: "127.0.0.1:8080"

# 程序数据目录；相对路径以本配置文件所在目录为基准，默认 ./data。
# 凭证放在 credentials/，缓存放在 cache/ 子目录中。
data_path: "./data"

# 凭证目录规则（启动时扫描 data_path/credentials/，只扫描这一层）：
# - 每个凭证文件对应一个账号，文件名为 <GitHub 用户名>.json，例如 alice.json。
#   文件名去掉 .json 后必须是合法的 GitHub 用户名（字母、数字，片段之间以单个 - 或 _ 分隔，不以分隔符开头或结尾，长度 1 到 100）。
# - 忽略隐藏文件（以 . 开头）、非 .json 文件、子目录和指向目录的符号链接。
# - 凭证中的 user 字段可省略；若填写，必须与文件名中的用户名一致（忽略大小写）。
# - 账号按文件名排序加载；选择账号时先按是否冷却（未冷却优先）、priority（高者优先）与额度档位（有 Credits 者优先）分档，同档内按额度权重轮流使用，见 docs/pool.md。host 与 oauth_token 都相同的两个账号会导致启动失败。
# 格式示例：{"oauth_token":"...","host":"acme.ghe.com","user":"alice"}
# 可选的 disabled 字段：为 true 时账号启动后不参与选择；通常由管理接口写入，无需手动填写。
# 可选的 priority 字段：-1 到 100 之间的整数，省略时为 0，数值越大越优先被选择；通常由管理接口写入。
# 请将每个凭证文件权限设为 0600（chmod 600）。

# 可选的 GitHub Enterprise Cloud 登录域名；设置后覆盖所有凭证文件中的 host。
# 留空时各账号使用凭证中的 host，缺省为 github.com。
host: ""

# 本服务的访问密钥，不是 GitHub token。非本机监听地址必须设置。
api_key: ""

# 管理密钥：用于 Web 控制台（/management）和管理接口（/v0/management/）。留空表示两者都不存在。
# 必须与 api_key 不同；管理接口只接受 Authorization: Bearer，不接受服务访问密钥。
# 建议使用至少 32 个字符的随机字符串；服务不对管理接口做失败次数限制。
# 设置后 credentials 目录不存在会自动创建（权限 0700），并允许暂时没有任何账号。
management_key: ""

# 会话亲和：同一客户端会话的生成请求固定使用同一账号，以提高上游提示词缓存的命中率。默认 true；false 时每个请求都按优先级与额度档位分档、档内轮询选择账号。
# 绑定在服务关闭时保存到 <data_path>/cache/session_affinity.json，启动时读回。
session_affinity: true

# 会话绑定的有效期，使用 Go duration 格式；必须大于 0，默认 2h。每次使用都会续期。
session_affinity_ttl: "2h"

# 每个账号的有效会话绑定数上限，必须是大于等于 0 的整数，默认 5；0 表示不限制。
# 新会话（以及绑定账号失败后的切换）优先选择未达上限的账号，以分散负载；已有可用绑定的会话不受此限制，
# 所有账号都达到上限时照常分配。仅在 session_affinity 开启时生效。
session_affinity_max_per_account: 5

# 日志级别：debug、info、warn 或 error。debug 会记录脱敏后的完整上游 API 正文，
# 会增加内存和日志占用；日志中也可能包含提示词和生成内容等业务数据。
log_level: "info"

# 日志目录；相对路径以本配置文件所在目录为基准，默认 ./logs。
logs_path: "./logs"

# 日志单文件大小上限，单位 MiB；必须为正整数，默认 10。
log_max_size_mb: 10

# 达到大小上限后最多保留的滚动备份数，范围 0 到 100，默认 5；0 表示不保留备份。
log_max_backups: 5

# 模型列表缓存有效期，使用 Go duration 格式；必须大于 0，默认 2h。
models_cache_ttl: "2h"

# 额度刷新间隔，使用 Go duration 格式；必须不小于 1m，默认 1h。
# 服务运行期间后台每分钟检查一次，距上次尝试已达到该间隔的账号会刷新额度（无需打开控制台）。
# 请求失败（非 429）时也会异步刷新该账号的额度，见 docs/quota-stats.md。
quota_refresh_interval: "1h"

# 配置文件不保存凭证值；仍建议将实际 config.yaml 权限设为 0600（chmod 600）。
