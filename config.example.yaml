# HTTP 监听地址；省略或留空时使用 127.0.0.1:8080。
listen: "127.0.0.1:8080"

# 程序数据目录；相对路径以本配置文件所在目录为基准，默认 ./data。
# 凭证放在 credentials/，缓存放在 cache/ 子目录中。
data_path: "./data"

# 凭证目录规则（启动时扫描 data_path/credentials/，只扫描这一层）：
# - 每个凭证文件对应一个账号，文件名为 <GitHub 用户名>.json，例如 alice.json。
#   文件名去掉 .json 后必须是合法的 GitHub 用户名（字母、数字和单个连字符，不以连字符开头或结尾，长度 1 到 39）。
# - 忽略隐藏文件（以 . 开头）、非 .json 文件、子目录和指向目录的符号链接。
# - 凭证中的 user 字段可省略；若填写，必须与文件名中的用户名一致（忽略大小写）。
# - 账号按文件名排序，轮询顺序即此顺序；host 与 oauth_token 都相同的两个账号会导致启动失败。
# 格式示例：{"oauth_token":"...","host":"acme.ghe.com","user":"alice"}
# 请将每个凭证文件权限设为 0600（chmod 600）。

# 可选的 GitHub Enterprise Cloud 登录域名；设置后覆盖所有凭证文件中的 host。
# 留空时各账号使用凭证中的 host，缺省为 github.com。
host: ""

# 本服务的访问密钥，不是 GitHub token。非本机监听地址必须设置。
api_key: ""

# 日志级别：debug、info、warn 或 error。debug 会记录脱敏后的完整上游 API 正文，
# 会增加内存和日志占用；日志中也可能包含提示词和生成内容等业务数据。
log_level: "info"

# 日志目录；相对路径以本配置文件所在目录为基准，默认 ./logs。
logs_path: "./logs"

# 日志单文件大小上限，单位 MiB；必须为正整数，默认 10。
log_max_size_mb: 10

# 达到大小上限后最多保留的滚动备份数，范围 0 到 100，默认 5；0 表示不保留备份。
log_max_backups: 5

# 模型列表缓存有效期，使用 Go duration 格式；必须大于 0，默认 2h。
models_cache_ttl: "2h"

# 配置文件不保存凭证值；仍建议将实际 config.yaml 权限设为 0600（chmod 600）。
